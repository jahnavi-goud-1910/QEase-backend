# Production Profile: External MySQL 8 Database Configuration
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/qease_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
