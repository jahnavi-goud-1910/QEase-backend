# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Info
spring.application.name=qease-backend

# Default Database: Embedded H2 Engine in MySQL Compatibility Mode
# (Zero-configuration startup: works out-of-the-box without requiring local MySQL configuration)
spring.datasource.url=jdbc:h2:mem:qease_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security & JWT Configuration
qease.jwt.secret=9a2f8c7d6e5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f
qease.jwt.expiration-ms=86400000

# CORS: comma-separated frontend origins allowed to call the API ("*" = any, for local development).
# In production set QEASE_CORS_ALLOWED_ORIGINS=https://your-frontend.example.com
qease.cors.allowed-origins=*

# Demo data: seeds the demo users/services/counters. Set QEASE_SEED_DEMO_DATA=false for a real deployment.
qease.seed-demo-data=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.qease=INFO
